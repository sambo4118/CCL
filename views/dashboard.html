<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>CLL</title>
        <link rel="stylesheet" href="/css/my-bulma-project.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <script type="module" src="/navbar.js"></script>
        <script type="module" src="./dashboard.js"></script>
    </head>
    <body>
        <!-- NAVBAR -->
         <section class="section is-hidden-mobile">
         </section>
        <section class="section dashboard-controls-section">
             <nav class="level is-mobile is-flex-wrap-wrap dashboard-toolbar">
                 <div class="level-left is-hidden-mobile dashboard-stats">
                     <div class="level-item has-text-centered">
                         <div class="columns is-2 is-mobile dashboard-stats-columns">
                             <div class="column has-text-centered is-4 is-paddingless">
                                 <div class="box has-background-info px-2">
                                     <p class="title has-text-white is-6 has-text-centered"><span style="white-space: nowrap;">Outstanding:</span><br><span id="outstandingCheckouts">...</span></p>
                                 </div>
                             </div>
                             <div class="column has-text-centered is-4 is-paddingless">
                                 <div class="box has-background-warning px-2">
                                     <p class="title has-text-white is-6">Due Today:<br><span id="dueCheckouts">...</span></p>
                                 </div>
                             </div>
                             <div class="column has-text-centered is-4 is-paddingless">
                                 <div class="box has-background-danger px-2">
                                     <p class="title has-text-white is-6">Overdue:<br><span id="overdueCheckouts">...</span></p>
                                 </div>
                             </div>
                         </div>
                     </div>
                 </div>
                 <div class="level-right dashboard-actions">
                     <div class="level-item">
                         <button class="button is-primary has-text-white" id="addBookButton">
                             <span class="icon"><i class="fas fa-plus"></i></span>
                             <span>Add Book</span>
                         </button>
                     </div>
                     <div class="level-item">
                         <button class="button is-primary has-text-white" id="addCheckoutButton">
                             <span class="icon"><i class="fas fa-plus"></i></span>
                             <span>Add Checkout</span>
                         </button>
                     </div>
                     <div class="level-item">
                         <div class="field">
                             <div class="control" id="sortByControl">
                                 <div class="select is-primary" id ="sortBySelect">
                                     <select id="sortBy">
                                         <option value="due">Due</option>
                                         <option value="title">Title</option>
                                         <option value="student">Student</option>
                                         <option value="class">Class</option>
                                     </select>
                                 </div>
                             </div>
                         </div>
                     </div>
                     <div class="level-item dashboard-search-item">
                         <div class="field">
                             <div class="control has-icons-right has-icons-left">
                                 <input class="input is-primary" type="text" placeholder="Search" id="searchInput">
                                 <span class="icon is-small is-left">
                                     <i class="fas fa-search"></i>
                                 </span>
                                 <span class="icon is-small is-right">
                                     <i class="fas fa-book" id="clearSearch"></i>
                                 </span>
                             </div>
                         </div>
                     </div>
                 </div>
             </nav>
         </section>
        <div id="checkoutsContainer" class="mr-6 ml-6">
            <!-- Checkouts will be dynamically inserted here -->
        </div>
    </body>
</html>
