<!doctype html>
<html class="is-clipped">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CLL</title>
    <link rel="stylesheet" href="/css/my-bulma-project.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module" src="/navbar.js"></script>
    <script type="module" src="./settingsView.js"></script>
  </head>
    <body>
        <!-- NAVBAR -->
         <div class="container mt-5">
            <div class="columns is-multiline is-2">
                <div class="column is-one-quarter">
                    <div class="button is-responsive is-info has-text-white" id="importBooksButton">
                      <div class="columns m-1 is-vcentered">
                        <div class="column is-narrow mr-3">
                          <span class="icon">
                            <i class="fa-solid fa-file-import fa-2x"></i>
                          </span>
                        </div>
                        <div class="column">
                          <p class="is-size-4">Import Books</p>
                        </div>
                    </div>
                </div>
              </div>
                <div class="column is-one-quarter">
                    <div class="button is-responsive is-info has-text-white" id="manageUsersButton">
                        <div class="columns m-1 is-vcentered">
                            <div class="column is-narrow mr-3">
                              <span class="icon">
                                <i class="fa-solid fa-users fa-2x"></i>
                              </span>
                            </div>
                            <div class="column">
                              <p class="is-size-4">Manage Users</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="column is-one-quarter">
                    <div class="button is-responsive is-info has-text-white" id="importStudentsButton">
                      <div class="columns m-1 is-vcentered">
                        <div class="column is-narrow mr-3">
                          <span class="icon">
                            <i class="fa-solid fa-user-graduate fa-2x"></i>
                          </span>
                        </div>
                        <div class="column">
                          <p class="is-size-4">Import Students</p>
                        </div>
                    </div>
                </div>
              </div>
                <div class="column is-one-quarter">
                    <div class="button is-responsive is-info has-text-white" id="addClassButton">
                      <div class="columns m-1 is-vcentered">
                        <div class="column is-narrow mr-3">
                          <span class="icon">
                            <i class="fa-solid fa-chalkboard-user fa-2x"></i>
                          </span>
                        </div>
                        <div class="column">
                          <p class="is-size-4">Add Class</p>
                        </div>
                      </div>
                    </div>
                </div>
                <div class="column is-one-quarter">
                    <div class="button is-responsive is-info has-text-white" id="addStudentButton">
                      <div class="columns m-1 is-vcentered">
                        <div class="column is-narrow mr-3">
                          <span class="icon">
                            <i class="fa-solid fa-user-plus fa-2x"></i>
                          </span>
                        </div>
                        <div class="column">
                          <p class="is-size-4">Add Student</p>
                        </div>
                      </div>
                    </div>
                </div>
                <div class="column is-one-quarter">
                    <div class="button is-responsive is-warning has-text-white" id="manageBackupsButton">
                      <div class="columns m-1 is-vcentered">
                        <div class="column is-narrow mr-3">
                          <span class="icon">
                            <i class="fa-solid fa-database fa-2x" aria-hidden="true"></i>
                          </span>
                        </div>
                        <div class="column">
                          <p class="is-size-4">Manage Backups</p>
                        </div>
                      </div>
                    </div>
                </div>
                <div class="column is-one-quarter">
                    <a class="button is-responsive is-warning has-text-white" id="checkInventoryButton" href="/check-inventory">
                      <div class="columns m-1 is-vcentered">
                        <div class="column is-narrow mr-3">
                          <span class="icon">
                            <i class="fa-solid fa-clipboard-check fa-2x" aria-hidden="true"></i>
                          </span>
                        </div>
                        <div class="column">
                          <p class="is-size-4">Check Inventory</p>
                        </div>
                      </div>
                    </a>
                </div>
            </div>
        </div>
    </body>
    
    <div class="modal" id="manageUsersModal">
      <div class="modal-background"></div>
      <div class="modal-card">
        <header class="modal-card-head">
          <p class="modal-card-title">Manage Users</p>
          <button class="delete" aria-label="close" id="closeManageUsersModal"></button>
        </header>
        <section class="modal-card-body">
          <div id="userChipsContainer">
            <!-- User list will be populated here -->
          </div>
          <div class="columns is-2">
            <div class="column">
              <input class="input mb-3" type="text" id="newUserEmail" placeholder="Enter user email">
            </div>
            <div class="column is-narrow">
              <button class="button is-success has-text-white" id="addUserButton">Add User</button>
            </div>
          </div>
        </section>
        <footer class="modal-card-foot">
          <button class="button" id="closeManageUsersFooterButton">Close</button>
        </footer>
      </div>
    </div>
    </div>
    
    <div class="modal" id="importBooksModal">
      <div class="modal-background"></div>
      <div class="modal-card">
        <header class="modal-card-head">
          <p class="modal-card-title">Import Books</p>
          <button class="delete" aria-label="close" id="closeImportModal"></button>
        </header>
        <section class="modal-card-body">
          <div class="file has-name is-boxed is-fullwidth">
            <label class="file-label">
              <input class="file-input" type="file" name="resume" id="bookFileInput">
              <span class="file-cta">
                <span class="file-icon">
                  <i class="fas fa-upload"></i>
                </span>
                <span class="file-label">
                  Choose a file…
                </span>
              </span>
              <span class="file-name" id="fileName">
                No file selected
              </span>
            </label>
          </div>
        </section>
        <footer class="modal-card-foot">
          <button class="button is-success has-text-white mr-2" id="confirmImport">Import</button>
          <button class="button" id="cancelImport">Cancel</button>
        </footer>
      </div>
    </div>
    
    <div class="modal" id="importStudentsModal">
      <div class="modal-background"></div>
      <div class="modal-card">
        <header class="modal-card-head">
          <p class="modal-card-title">Import Students</p>
          <button class="delete" aria-label="close" id="closeStudentImportModal"></button>
        </header>
        <section class="modal-card-body">
          <div class="file has-name is-boxed is-fullwidth">
            <label class="file-label">
              <input class="file-input" type="file" name="students" id="studentFileInput">
              <span class="file-cta">
                <span class="file-icon">
                  <i class="fas fa-upload"></i>
                </span>
                <span class="file-label">
                  Choose a file…
                </span>
              </span>
              <span class="file-name" id="studentFileName">
                No file selected
              </span>
            </label>
          </div>
        </section>
        <footer class="modal-card-foot">
          <button class="button is-success has-text-white mr-2" id="confirmStudentImport">Import</button>
          <button class="button" id="cancelStudentImport">Cancel</button>
        </footer>
      </div>
    </div>

    <div class="modal" id="manageBackupsModal" role="dialog" aria-modal="true" aria-labelledby="manageBackupsModalTitle">
      <div class="modal-background" id="manageBackupsBackdrop"></div>
      <div class="modal-card" style="width: min(940px, 95vw);">
        <header class="modal-card-head has-background-warning">
          <p class="modal-card-title has-text-white" id="manageBackupsModalTitle">
            <span class="icon mr-2"><i class="fa-solid fa-database" aria-hidden="true"></i></span>
            <span>Manage Backups</span>
          </p>
          <button type="button" class="delete" aria-label="Close Manage Backups modal" id="closeManageBackupsModal"></button>
        </header>
        <section class="modal-card-body">
          <div id="backupStatusBanner" class="notification is-hidden mb-4 py-3 px-4" role="status" aria-live="polite"></div>

          <div id="backupConfirmBanner" class="notification is-warning is-hidden mb-4 py-3 px-4" role="alert">
            <div class="level is-mobile is-flex-wrap-wrap">
              <div class="level-left">
                <div class="level-item">
                  <p id="backupConfirmMessage" class="has-text-weight-semibold"></p>
                </div>
              </div>
              <div class="level-right">
                <div class="level-item buttons">
                  <button type="button" class="button is-small is-danger has-text-white" id="confirmLoadBackupButton">Confirm Load</button>
                  <button type="button" class="button is-small" id="cancelLoadBackupButton">Cancel</button>
                </div>
              </div>
            </div>
          </div>

          <div class="mb-5">
            <div class="level is-mobile mb-2">
              <div class="level-left">
                <div class="level-item">
                  <h2 class="title is-5 mb-0 has-text-warning">
                    <span class="icon mr-1"><i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i></span>
                    <span>Automatic Backups</span>
                  </h2>
                </div>
                <div class="level-item">
                  <span class="tag is-warning is-light" id="autoBackupCountTag">0 / 5</span>
                </div>
              </div>
              <div class="level-right">
                <div class="level-item">
                  <p class="is-size-7 has-text-grey-light" id="autoBackupScheduleText">Periodic automatic snapshots (past 5)</p>
                </div>
              </div>
            </div>
            <ul id="automaticBackupsRow" class="columns is-multiline is-variable is-2 mb-0" role="list" style="list-style: none; margin-left: 0;">
              <!-- Automatic backups row populated dynamically -->
            </ul>
          </div>

          <hr class="my-4">

          <div>
            <div class="level is-mobile mb-2">
              <div class="level-left">
                <div class="level-item">
                  <h2 class="title is-5 mb-0 has-text-warning">
                    <span class="icon mr-1"><i class="fa-solid fa-hand-pointer" aria-hidden="true"></i></span>
                    <span>Manual Backups</span>
                  </h2>
                </div>
                <div class="level-item">
                  <span class="tag is-warning is-light" id="manualBackupCountTag">0 / 5</span>
                </div>
              </div>
              <div class="level-right">
                <div class="level-item">
                  <p class="is-size-7 has-text-grey-light">User-created snapshots (past 5)</p>
                </div>
              </div>
            </div>
            <ul id="manualBackupsRow" class="columns is-multiline is-variable is-2 mb-0" role="list" style="list-style: none; margin-left: 0;">
              <!-- Manual backups row populated dynamically -->
            </ul>
          </div>
        </section>
        <footer class="modal-card-foot is-justify-content-space-between is-flex-wrap-wrap" style="gap: 0.5rem;">
          <div class="buttons mb-0">
            <button type="button" class="button is-warning has-text-white" id="makeBackupButton">
              <span class="icon"><i class="fa-solid fa-plus" aria-hidden="true"></i></span>
              <span>Make Backup</span>
            </button>
            <button type="button" class="button is-warning is-outlined" id="loadSelectedBackupButton" disabled>
              <span class="icon"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i></span>
              <span>Load Selected Backup</span>
            </button>
          </div>
          <div class="buttons mb-0">
            <button type="button" class="button" id="closeManageBackupsFooterButton">Close</button>
          </div>
        </footer>
      </div>
    </div>

</html>
