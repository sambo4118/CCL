<!doctype html>
<html class="is-clipped">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CLL</title>
    <link rel="stylesheet" href="/css/my-bulma-project.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../navbar.js"></script>
    <script type="module" src="./settingsView.js"></script>
  </head>
    <body>
        <!-- NAVBAR -->
         <div class="container mt-5">
            <div class="columns is-multiline">
                <div class="column is-3">
                    <div class="button is-responsive is-info has-text-white" id="importBooksButton">
                      <div class="columns m-1 is-vcentered">
                        
                        <div class="column is-narrow">
                          <span class="icon is-">
                            <i class="fa-solid fa-file-import fa-2x"></i>
                          </span>
                        </div>

                        <div class="column">
                          <p class="is-size-4">Import Books</p>
                        </div>

                    </div>
                </div>
            </div>
          </div>
    </body>
    <div class="modal" id="importBooksModal">
      <div class="modal-background"></div>
      <div class="modal-card">
        <header class="modal-card-head">
          <p class="modal-card-title">Import Books</p>
          <button class="delete" aria-label="close" id="closeImportModal"></button>
        </header>
        <section class="modal-card-body">
          <div class="file has-name is-boxed is-fullwidth">
            <label class="file-label">
              <input class="file-input" type="file" name="resume" id="bookFileInput">
              <span class="file-cta">
                <span class="file-icon">
                  <i class="fas fa-upload"></i>
                </span>
                <span class="file-label">
                  Choose a file…
                </span>
              </span>
              <span class="file-name" id="fileName">
                No file selected
              </span>
            </label>
          </div>
        </section>
        <footer class="modal-card-foot">
          <button class="button is-success" id="confirmImport">Import</button>
          <button class="button" id="cancelImport">Cancel</button>
        </footer>
      </div>
    </div>
</html>
