<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CLL</title>
    <link rel="stylesheet" href="/css/my-bulma-project.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module" src="./navbar.js"></script>
    <script type="module" src="./searchView.js"></script>
  </head>
    <body>
        <!-- NAVBAR -->
        <div class="container mt-5 mb-6">
            <div class="columns">
                <div class="column is-6">
                    <div class="field">
                        <div class="control has-icons-left">
                            <input 
                                class="input is-info" 
                                type="text" 
                                placeholder="Search books, students, classes, authors..." 
                                id="searchInput"
                                autocomplete="off"
                            >
                            <span class="icon is-small is-left">
                                <i class="fas fa-search"></i>
                            </span>
                        </div>
                        <p class="help">Search for books, students, classes, authors, and more</p>
                    </div>
                </div>
            </div>
            <div class="box mt-4" id="searchResults" style="display: none;"></div>
        </div>
    </body>
</html>
